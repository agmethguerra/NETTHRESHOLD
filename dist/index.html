  <style>/* NetThreshold v1.3 — consola de red futurista. Azul profundo, cian eléctrico, paneles con esquinas
   de visor y retícula de fondo. El ámbar queda reservado al umbral; verde/rojo, a los estados. */
:root {
  --bg: #040814; --surface: #0a1226; --panel: rgba(12, 22, 46, 0.78); --ink: #e8f1ff; --ink-2: #9fb4d6; --muted: #7088ad;
  --rule: #16305a; --rule-soft: #0f2142; --line: #1d3d73; --track: #0f1f40;
  --accent: #35d0ff; --accent-2: #3b82ff; --accent-ink: #02101c; --accent-soft: rgba(53, 208, 255, 0.1);
  --ok: #3ee0a0; --ok-bg: rgba(62, 224, 160, 0.1); --warn: #ffb84d; --warn-bg: rgba(255, 184, 77, 0.1);
  --error: #ff6b6b; --error-bg: rgba(255, 107, 107, 0.1); --pending: #8aa0c4; --pending-bg: rgba(138, 160, 196, 0.1);
  --info: #6fb6ff; --info-bg: rgba(59, 130, 255, 0.12);
  --display: Bahnschrift, "DIN Alternate", "Eurostile", "Segoe UI", system-ui, sans-serif;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --radius: 3px; --glow: 0 0 22px rgba(53, 208, 255, 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 15px/1.55 var(--sans); min-height: 100vh; background-color: var(--bg);
  background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 130, 255, 0.22), transparent 70%),
    linear-gradient(rgba(53, 208, 255, 0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(53, 208, 255, 0.045) 1px, transparent 1px);
  background-size: auto, 44px 44px, 44px 44px; background-attachment: fixed;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.15; letter-spacing: 0.01em; margin: 0; font-weight: 600; }
h1 { font-size: clamp(26px, 3.2vw, 36px); text-shadow: 0 0 24px rgba(53, 208, 255, 0.3); }
h2 { font-size: 20px; } h3 { font-size: 16px; }
p { margin: 0 0 10px; max-width: 72ch; }
a { color: var(--accent); text-underline-offset: 3px; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: var(--glow); }
[hidden] { display: none !important; }

/* ---- Cabecera ---- */
.strip { display: flex; align-items: center; gap: 10px; padding: 5px 28px; font: 12px var(--mono); letter-spacing: 0.04em; color: var(--muted); border-bottom: 1px solid var(--rule-soft); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.topbar { display: flex; align-items: center; gap: 16px; padding: 12px 28px; background: rgba(4, 8, 20, 0.72); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.55; }
.brand { display: inline-flex; align-items: center; gap: 10px; font: 600 21px var(--display); letter-spacing: 0.06em; color: var(--ink); text-decoration: none; }
.brand .logo { display: inline-flex; filter: drop-shadow(0 0 8px rgba(53, 208, 255, 0.5)); }
.brand > span:not(.logo) { color: var(--accent); }
.modnav { display: flex; gap: 4px; margin-left: auto; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: rgba(10, 18, 38, 0.8); }
.modnav a { color: var(--ink-2); text-decoration: none; padding: 6px 16px; border-radius: 999px; font: 600 13.5px var(--display); letter-spacing: 0.03em; }
.modnav a:hover { color: var(--ink); }
.modnav a[aria-current="page"] { color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: var(--glow); }
.backend { display: none; }
main { max-width: 1240px; margin: 0 auto; padding: 30px 28px 80px; }

/* ---- Espacio de trabajo ---- */
.workspace { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 40px; align-items: start; }
.rail { position: sticky; top: 84px; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li { position: relative; padding-bottom: 6px; }
.rail li::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: -6px; width: 1px; background: var(--line); }
.rail li:last-child::before { display: none; }
.rail a { display: grid; grid-template-columns: 29px 1fr; gap: 10px; align-items: center; padding: 5px 8px 5px 0; color: var(--ink-2); text-decoration: none; font-size: 14.5px; }
.rail a:hover .step-label { color: var(--ink); }
.step-mark { width: 29px; height: 29px; border-radius: 8px; transform: rotate(45deg) scale(0.85); border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; font: 600 13px var(--mono); color: var(--ink-2); }
.step-mark { transform: none; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); border: 0; background: var(--line); }
.rail a[aria-current="step"], .rail a[aria-current="step"].done .step-mark, .rail a[aria-current="step"].warn .step-mark { color: var(--ink); font-weight: 600; }
.rail a[aria-current="step"] .step-mark, .rail a[aria-current="step"].done .step-mark, .rail a[aria-current="step"].warn .step-mark { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); box-shadow: var(--glow); }
.rail a.done .step-mark { background: var(--ok); color: var(--accent-ink); }
.rail a.warn .step-mark { background: var(--warn); color: var(--accent-ink); }
.rail a.locked { opacity: 0.5; }
.ws-head { margin-bottom: 22px; }
.crumb { font: 13px var(--mono); margin-bottom: 10px; display: inline-block; text-decoration: none; }
.ws-meta { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 10px; color: var(--ink-2); font-size: 14px; }

/* ---- Paneles con esquinas de visor ---- */
.block, .panel { position: relative; padding: 24px; margin-bottom: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(6px); }
.block::before, .panel::before, .block::after, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; border: 2px solid var(--accent); opacity: 0.9; }
.block::before, .panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.block::after, .panel::after { right: -2px; bottom: -2px; border-left: 0; border-top: 0; }
.block > h2, .panel > h2 { margin-bottom: 12px; }
.lede { color: var(--ink-2); font-size: 16px; max-width: 64ch; }
.hint { color: var(--muted); font-size: 13px; margin: 5px 0 0; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.spread { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }

/* ---- Inicio: consola de medición ---- */
.hud { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 18px; align-items: start; }
.hud-main { text-align: center; }
.hud-main .lede { margin-inline: auto; }
.hud-main h1 { margin-bottom: 6px; }
.gauge { max-width: 560px; margin: 8px auto 0; }
.gauge svg { width: 100%; height: auto; display: block; overflow: visible; }
.g-prog { transition: stroke-dasharray 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); filter: drop-shadow(0 0 7px rgba(53, 208, 255, 0.75)); }
.g-needle { fill: var(--ink); transform: rotate(-135deg); transform-origin: 200px 190px; transition: transform 0.8s cubic-bezier(0.2, 0.9, 0.25, 1.15); filter: drop-shadow(0 0 5px rgba(232, 241, 255, 0.8)); }
.g-hub { fill: var(--bg); stroke: var(--accent); stroke-width: 3; }
.g-val { font: 600 50px var(--mono); fill: var(--ink); filter: drop-shadow(0 0 10px rgba(53, 208, 255, 0.5)); }
.g-unit { font: 600 14px var(--display); letter-spacing: 0.12em; fill: var(--accent); }
.g-lbl { font: 11px var(--mono); fill: var(--ink-2); }

.hud-side .row { margin-top: 4px; }

@media (max-width: 880px) {

}

/* ---- v1.6: aprovecha el ancho, letra más grande y pasos como línea de tiempo vertical ---- */
body { font-size: 16.5px; }

.strip, .topbar { padding-inline: clamp(20px, 3vw, 56px); }

.btn { font-size: 15.5px; padding: 10px 18px; }

.workspace { grid-template-columns: 280px minmax(0, 1fr); gap: 56px; }
.ws-main, .ws-content { min-width: 0; }
.rail { top: 92px; padding: 22px 0 22px 4px; }
.rail ol { counter-reset: s; }
.rail li { position: relative; padding: 0; }
.rail li::before { content: ""; position: absolute; left: 13px; top: 38px; bottom: -10px; width: 2px; background: var(--line); border-radius: 1px; display: block; }
.rail li:last-child::before { display: none; }

.rail .step-mark { width: 28px; height: 28px; clip-path: none; border-radius: 50%; transform: none; border: 2px solid var(--line); background: var(--bg); color: var(--muted); font: 600 13px var(--mono); box-shadow: none; }
.rail a.done .step-mark { background: var(--ok); border-color: var(--ok); color: var(--accent-ink); }
.rail a.warn .step-mark { background: var(--warn); border-color: var(--warn); color: var(--accent-ink); }
.rail a[aria-current="step"] { color: var(--ink); font-weight: 600; }
.rail a[aria-current="step"] .step-mark, .rail a[aria-current="step"].done .step-mark, .rail a[aria-current="step"].warn .step-mark { background: var(--bg); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px rgba(53, 208, 255, 0.18); }
.rail li:has(a.done)::before { background: var(--ok); opacity: 0.55; }

.hud { grid-template-columns: minmax(0, 1.6fr) minmax(380px, 1fr); gap: 28px; }

.scenario-form .form-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.step-n { width: 30px; height: 30px; clip-path: none; border-radius: 50%; font-size: 14px; }
.form-step > h3 { font-size: 20px; } .step-lede { margin-left: 40px; font-size: 15.5px; }
.cards { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card-body strong { font-size: 17px; } .card-help { font-size: 14.5px; } .card-limit { font-size: 14px; }
.summary-text { font-size: 17px; }
.chart { height: 480px; } .chart.small { height: 300px; }
@media (max-width: 880px) {

  .workspace { grid-template-columns: minmax(0, 1fr); gap: 20px; }

}
.chart.svg-chart { height: auto; padding: 10px 12px; }

/* ---- v1.7: logotipo nuevo y marca proporcionada ---- */
.brand { gap: 14px; letter-spacing: 0; line-height: 1; }

/* ---- v1.8: lluvia de código en lugar de la retícula ---- */
body { background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 130, 255, 0.22), transparent 70%); background-size: auto; background-attachment: fixed; }
#rain { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.28; }
.topbar { z-index: 20; }
@media print { #rain { display: none; } }

/* Componentes: botones, formularios, tablas, avisos, gráficas y cifra principal. */

/* ---- Botones ---------------------------------------------------------------------------- */
.btn {
  font: 600 14px var(--sans); padding: 8px 15px; border-radius: var(--radius); border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink); cursor: pointer; line-height: 1.3;
  transition: background-color 0.12s, border-color 0.12s;
}
.btn:hover { border-color: var(--ink-2); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-danger { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, var(--rule)); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn-ghost:hover { background: var(--accent-soft); border-color: transparent; }
.btn-sm { padding: 4px 10px; font-size: 13px; }
.btn.busy { position: relative; color: transparent; pointer-events: none; }
.btn.busy::after {
  content: ""; position: absolute; inset: 0; margin: auto; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--accent-ink); border-top-color: transparent; animation: spin 0.7s linear infinite;
}
.btn-secondary.busy::after { border-color: var(--ink); border-top-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Formularios ------------------------------------------------------------------------ */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px 22px; }
.form-grid .wide { grid-column: 1 / -1; }
.field label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 5px; color: var(--ink); }
.field .req { color: var(--error); }
input, select, textarea {
  width: 100%; font: 15px var(--sans); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 10px;
}
input[type="number"], input.num { font-variant-numeric: tabular-nums; }
input[type="checkbox"] { width: auto; }
textarea { min-height: 84px; resize: vertical; }
input:disabled, select:disabled { background: var(--pending-bg); color: var(--muted); }
input[aria-invalid="true"] { border-color: var(--error); }
.field-error { color: var(--error); font-size: 13px; margin: 5px 0 0; }
.inline-form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.inline-form .field { min-width: 150px; flex: 1 1 150px; }
fieldset { border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; margin: 0; }
legend { font-weight: 600; padding: 0 6px; font-size: 13.5px; }

/* ---- Tablas ----------------------------------------------------------------------------- */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.data th { text-align: left; font-weight: 600; font-size: 13px; color: var(--ink-2); background: var(--bg); padding: 8px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.data td { padding: 8px 12px; border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data .num { text-align: right; }
table.data td.empty { text-align: center; color: var(--muted); padding: 22px; }
table.data.mono td, table.data.mono th { font-family: var(--mono); font-size: 12.5px; }
table.data input { padding: 4px 8px; font-size: 14px; min-width: 90px; }
.col-actions { white-space: nowrap; text-align: right; }

/* ---- Estados y avisos ------------------------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 6px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent;
}
.badge-mark { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; line-height: 1; color: #fff; }
.badge-ok { background: var(--ok-bg); color: var(--ok); }       .badge-ok .badge-mark { background: var(--ok); }
.badge-warn { background: var(--warn-bg); color: var(--warn); } .badge-warn .badge-mark { background: var(--warn); }
.badge-error { background: var(--error-bg); color: var(--error); } .badge-error .badge-mark { background: var(--error); }
.badge-pending { background: var(--pending-bg); color: var(--pending); } .badge-pending .badge-mark { background: var(--pending); }
.badge-info { background: var(--info-bg); color: var(--info); } .badge-info .badge-mark { background: var(--info); }
@media (prefers-color-scheme: dark) { .badge-mark { color: #0e151d; } }

.alert {
  display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 11px 14px; border-radius: var(--radius);
  border-left: 3px solid; margin: 12px 0; font-size: 14.5px;
}
.alert-mark { font-weight: 700; text-align: center; }
.alert-body > strong { display: block; margin-bottom: 2px; }
.alert-body p { margin: 4px 0 0; }
.alert-body ul { margin: 4px 0 0; padding-left: 18px; }
.alert-ok { background: var(--ok-bg); border-color: var(--ok); } .alert-ok .alert-mark { color: var(--ok); }
.alert-warn { background: var(--warn-bg); border-color: var(--warn); } .alert-warn .alert-mark { color: var(--warn); }
.alert-error { background: var(--error-bg); border-color: var(--error); } .alert-error .alert-mark { color: var(--error); }
.alert-info, .alert-pending { background: var(--info-bg); border-color: var(--info); } .alert-info .alert-mark, .alert-pending .alert-mark { color: var(--info); }

#toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 36px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22); }
.toast-error { background: var(--error); color: #fff; }

/* ---- Lista de escenarios ---------------------------------------------------------------- */
.scenario-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.scenario-item {
  display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) auto; gap: 8px 24px; align-items: center;
  padding: 16px 4px; border-bottom: 1px solid var(--rule);
}

.scenario-item h3 a:hover { color: var(--accent); text-decoration: underline; }
.scenario-item .meta { color: var(--ink-2); font-size: 13.5px; margin-top: 3px; }
.scenario-item .stats { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.scenario-item .actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 760px) { .scenario-item { grid-template-columns: 1fr; } .scenario-item .actions { justify-content: flex-start; } }
.empty-state { padding: 44px 0; max-width: 56ch; }
.empty-state h2 { margin-bottom: 8px; }

/* ---- Gráficas y cifras ------------------------------------------------------------------ */
.chart { position: relative; height: 400px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 14px 8px; }

.hero-figure { margin: 4px 0 16px; }

.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 28px; margin: 14px 0; }
.facts dt { font-size: 13px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

.checks { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.checks li { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.checks .q { font-weight: 600; }
.checks .a { grid-column: 2; color: var(--ink-2); font-size: 14px; }

.eq { font-family: var(--mono); font-size: 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 14px; overflow-x: auto; white-space: nowrap; }

.dropzone { border: 1.5px dashed var(--rule); border-radius: var(--radius); padding: 18px; background: var(--surface); }
.stack > * + * { margin-top: 14px; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 30px; color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.kpis b { color: var(--ink); font-weight: 600; }

iframe.report { width: 100%; height: 760px; border: 1px solid var(--rule); border-radius: var(--radius); background: #fff; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
details summary { cursor: pointer; color: var(--accent); font-weight: 600; }
details[open] summary { margin-bottom: 10px; }


/* ---- v1.3: acabado futurista de componentes ---- */
.btn { font: 600 14px var(--display); letter-spacing: 0.03em; background: rgba(10, 18, 38, 0.8); border-color: var(--line); color: var(--ink); border-radius: var(--radius); }
.btn:hover { border-color: var(--accent); box-shadow: 0 0 14px rgba(53, 208, 255, 0.25); }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--accent-ink); box-shadow: var(--glow); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); padding-inline: 20px; }
.btn-primary:hover { filter: brightness(1.12); box-shadow: 0 0 30px rgba(53, 208, 255, 0.55); }
.btn-ghost:hover { background: var(--accent-soft); }
input, select, textarea { background: rgba(4, 8, 20, 0.7); border-color: var(--line); color: var(--ink); }

.table-wrap, .chart, .dropzone, .eq, fieldset { background: rgba(6, 12, 28, 0.75); border-color: var(--line); }
table.data th { background: rgba(53, 208, 255, 0.07); color: var(--ink-2); font-family: var(--display); letter-spacing: 0.03em; }
table.data td { border-bottom-color: var(--rule-soft); }
.hero-value { font: 600 clamp(34px, 5vw, 56px)/1 var(--mono); text-shadow: 0 0 26px rgba(53, 208, 255, 0.4); }
.facts dd, .kpis b { font-family: var(--mono); }
.scenario-list { border-top-color: var(--line); } .scenario-item { border-bottom-color: var(--line); }
.verdict { margin: 6px 0 22px; padding: 20px 22px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(6, 12, 28, 0.75); }
.verdict-out { display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: center; margin-top: 14px; }
.verdict-row { flex: 0 0 auto; } .verdict .gauge { flex: 0 1 380px; margin: 0; }
.alert { border-radius: var(--radius); border-left-width: 3px; }
.toast { background: var(--surface); color: var(--ink); border: 1px solid var(--accent); box-shadow: var(--glow); }
.toast-error { background: var(--error-bg); border-color: var(--error); color: var(--ink); }
.badge-mark { color: var(--accent-ink); }
iframe.report { border-color: var(--line); }


/* ---- v1.5: formulario de escenario guiado ---- */
.scenario-form { max-width: 980px; }
.form-step { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
.form-step:first-of-type { margin-top: 12px; border-top: 0; padding-top: 0; }
.form-step > h3 { display: flex; align-items: center; gap: 10px; font-size: 17px; margin-bottom: 4px; }
.step-n { display: inline-grid; place-items: center; width: 26px; height: 26px; font: 600 13px var(--mono); color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2)); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.step-lede { color: var(--ink-2); margin: 0 0 14px 36px; max-width: 70ch; }
.field { position: relative; }
.field .counter { position: absolute; right: 0; top: 0; font: 12px var(--mono); color: var(--muted); }
.field-error { color: var(--error); font-size: 13px; margin: 5px 0 0; min-height: 0; }
.field-error:empty { display: none; }
.hint:empty { display: none; }
select:invalid, select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--error); }
input[type="date"], input[type="time"] { color-scheme: dark; }
input:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }

.unit-line, .fixed-metric { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 8px; }
.fixed-metric { margin-top: 0; }
.fixed-metric .hint { flex-basis: 100%; }
.fixed-label { font-size: 12.5px; color: var(--muted); }
.fixed-metric .fixed-label { flex-basis: 100%; font-weight: 600; font-size: 13.5px; color: var(--ink); }
.unit-chip { display: inline-block; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font: 600 13px var(--mono); color: var(--accent); background: var(--accent-soft); }

.unit-chip.empty { color: var(--muted); background: transparent; font-weight: 400; }
.unit-chip.empty::before { content: ""; }

details.guide { margin-top: 8px; font-size: 14px; }
details.guide ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 4px; }

fieldset.profile { border: 0; padding: 0; }
fieldset.profile legend { padding: 0; font-size: 13.5px; margin-bottom: 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; }
.card-opt { position: relative; display: block; cursor: pointer; }
.card-opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.card-body { display: grid; gap: 4px; height: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(6, 12, 28, 0.75); transition: border-color 0.12s, box-shadow 0.12s; }

.card-opt input:focus-visible + .card-body { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-body strong { font: 600 15px var(--display); }
.card-limit { font: 600 13px var(--mono); color: var(--warn); }
.card-help { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.custom-limit { margin-top: 16px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: var(--radius); }
.custom-limit label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 8px; }
.custom-row { display: grid; grid-template-columns: 110px auto minmax(140px, 1fr); gap: 10px; align-items: center; }
.custom-row input[type="text"] { text-align: right; font-family: var(--mono); }
input[type="range"] { padding: 0; border: 0; background: transparent; accent-color: var(--accent); box-shadow: none; }
.time-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }

.form-step.summary { padding: 16px 18px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent-soft); }
.form-step.summary h3 { font-size: 15px; margin-bottom: 8px; }
.summary-text { margin: 0; font-size: 15.5px; line-height: 1.6; max-width: none; }
.summary-text strong { color: var(--accent); font-weight: 600; }
.form-status { margin: 0; font-size: 14px; max-width: none; }
.form-status.todo { color: var(--warn); }
.form-status.ok { color: var(--ok); }
@media (max-width: 640px) { .custom-row { grid-template-columns: 90px auto; } .custom-row input[type="range"] { grid-column: 1 / -1; } .step-lede { margin-left: 0; } }
.scenario-form .form-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
</style>
